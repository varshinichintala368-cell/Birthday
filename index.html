<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    width:90%;
    max-width:350px;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    z-index:10;
}

h1{
    color:#ff4081;
    font-size:2em;
    animation:glow 1.5s infinite alternate;
}

h2{
    color:#ff6f61;
    margin:10px 0;
}

p{
    color:#444;
    margin-top:10px;
    line-height:1.5;
}

button{
    margin-top:20px;
    padding:12px 20px;
    border:none;
    border-radius:30px;
    background:#ff4081;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#e91e63;
}

@keyframes glow{
from{text-shadow:0 0 10px pink;}
to{text-shadow:0 0 25px red;}
}

/* Balloons */

.balloon{
    position:absolute;
    bottom:-150px;
    width:50px;
    height:70px;
    border-radius:50%;
    animation:float 8s linear infinite;
}

.balloon:after{
    content:"";
    position:absolute;
    width:2px;
    height:60px;
    background:#555;
    left:24px;
    top:70px;
}

.red{background:#ff4d4d; left:10%;}
.blue{background:#4da6ff; left:30%; animation-delay:2s;}
.green{background:#66cc66; left:60%; animation-delay:4s;}
.yellow{background:#ffd633; left:85%; animation-delay:1s;}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

/* Confetti */

.confetti{
    position:absolute;
    width:10px;
    height:10px;
    top:-10px;
    animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
}
}
</style>
</head>

<body>

<div class="balloon red"></div>
<div class="balloon blue"></div>
<div class="balloon green"></div>
<div class="balloon yellow"></div>

<div class="card">
<h1>🎉 Happy Birthday 🎉</h1>

<h2>Dear Friend ❤️</h2>

<p>
May your day be filled with happiness, laughter,
love, and unforgettable memories.
Wishing you success, good health,
and endless joy.
Have a wonderful birthday! 🎂🎁
</p>

<button onclick="celebrate()">Celebrate 🎉</button>
</div>

<script>

// Confetti

function celebrate(){

for(let i=0;i<150;i++){

let c=document.createElement("div");

c.classList.add("confetti");

c.style.left=Math.random()*100+"vw";

c.style.background=hsl(${Math.random()*360},100%,50%);

c.style.animationDuration=(2+Math.random()*3)+"s";

c.style.opacity=Math.random();

document.body.appendChild(c);

setTimeout(()=>{
c.remove();
},5000);

}
}

// Auto start

celebrate();

</script>

</body>
</html>
